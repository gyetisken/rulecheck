[project]
name = "rulecheck"
version = "0.1.0"
description = "Read city short-term rental ordinances with an LLM, compare them under one canonical model"
readme = "README.md"
authors = [
    { name = "gyetisken", email = "gyetisken@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rulecheck = "rulecheck.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
